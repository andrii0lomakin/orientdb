name: Java CI/CD Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel in-progress runs for PRs and merge queue, not for develop pushes.
  # On develop, cancelling a running build when a non-buildable commit (e.g. docs)
  # arrives would skip testing the buildable commits from the cancelled run.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  detect-changes:
    name: Detect Build-Relevant Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.should_build }}
      run_integration_tests: ${{ steps.filter.outputs.run_integration_tests }}
      integration_skip_reason: ${{ steps.filter.outputs.integration_skip_reason }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          overwrite-settings: false

      - name: Read trusted head commit subject
        id: head_commit
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if HEAD_COMMIT_SUBJECT=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
            --jq '.commit.message | split("\n")[0]'); then
            echo "read_status=success" >> "$GITHUB_OUTPUT"
            echo "subject=$HEAD_COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          else
            echo "read_status=failure" >> "$GITHUB_OUTPUT"
            echo "subject=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for build-relevant changes
        id: filter
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_READ_STATUS: ${{ steps.head_commit.outputs.read_status }}
          HEAD_COMMIT_SUBJECT: ${{ steps.head_commit.outputs.subject }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          emit_decision() {
            echo "should_build=$1" >> "$GITHUB_OUTPUT"
            echo "run_integration_tests=$RUN_INTEGRATION_TESTS" >> "$GITHUB_OUTPUT"
            echo "integration_skip_reason=$INTEGRATION_SKIP_REASON" >> "$GITHUB_OUTPUT"
          }

          RUN_INTEGRATION_TESTS=true
          INTEGRATION_SKIP_REASON=

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual trigger — always build and run integration tests"
            emit_decision true
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
            RUN_INTEGRATION_TESTS=false
            INTEGRATION_SKIP_REASON=merge-group
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            RUN_INTEGRATION_TESTS=false
            INTEGRATION_SKIP_REASON=push
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 1
          fi

          # Only a nonempty, same-repository pull request head is trusted.
          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPOSITORY" \
            && "$HEAD_REPOSITORY" == "$CURRENT_REPOSITORY" ]]; then
            if [[ "$HEAD_COMMIT_READ_STATUS" != "success" ]]; then
              echo "::warning::The head commit message could not be read. Integration tests will run."
            elif [[ "$HEAD_COMMIT_SUBJECT" == *"[no-it-tests]"* ]]; then
              RUN_INTEGRATION_TESTS=false
              INTEGRATION_SKIP_REASON=no-it-tests
              echo "The head commit subject contains [no-it-tests]. Integration tests will be skipped."
            fi
          fi

          # Initial pushes and unreachable comparison bases must build.
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push — always build"
            emit_decision true
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base SHA $BASE_SHA not reachable — always build"
            emit_decision true
            exit 0
          fi

          # The three-dot diff compares the selected pull request, push, or merge-group base with HEAD.
          CHANGED_FILES=$(git diff --no-renames --name-only "$BASE_SHA...HEAD")

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No changed files detected — skipping build"
            emit_decision false
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # One changed-file list controls both Markdown and build decisions.
          ONLY_MARKDOWN=true
          while IFS= read -r file; do
            if [[ "$file" != *.md ]]; then
              ONLY_MARKDOWN=false
              break
            fi
          done <<< "$CHANGED_FILES"
          if [[ "$EVENT_NAME" == "pull_request" && "$RUN_INTEGRATION_TESTS" == "true" \
            && "$ONLY_MARKDOWN" == "true" ]]; then
            RUN_INTEGRATION_TESTS=false
            INTEGRATION_SKIP_REASON=markdown-only
            echo "Every changed file ends in .md. Integration tests will be skipped."
          fi

          # Extract Maven module directories using Maven itself.
          set +e
          MODULES=$(./mvnw $MAVEN_SETTINGS -q help:evaluate \
            -Dexpression=project.modules -DforceStdout -N \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          MVN_EXIT=$?
          set -e

          if [[ -z "$MODULES" ]]; then
            echo "Failed to extract Maven modules (mvn exit code: $MVN_EXIT) — always build"
            emit_decision true
            exit 0
          fi

          echo "Maven modules detected:"
          echo "$MODULES"
          echo ""

          SHOULD_BUILD=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == *.md ]]; then
              continue
            fi

            if [[ "$file" == pom.xml ]] || [[ "$file" == .mvn/* ]] || \
               [[ "$file" == mvnw ]] || [[ "$file" == mvnw.cmd ]] || \
               [[ "$file" == .github/workflows/* ]] || \
               [[ "$file" == .idea/inspectionProfiles/* ]]; then
              SHOULD_BUILD=true
              echo "Build-relevant file found: $file"
              break
            fi

            while IFS= read -r module; do
              [[ -z "$module" ]] && continue
              if [[ "$file" == "$module"/* ]]; then
                SHOULD_BUILD=true
                echo "Build-relevant file found: $file (module: $module)"
                break 2
              fi
            done <<< "$MODULES"
          done <<< "$CHANGED_FILES"

          if [[ "$SHOULD_BUILD" == "false" ]]; then
            echo "No build-relevant changes — skipping build"
          fi
          emit_decision "$SHOULD_BUILD"

  test-linux:
    name: Linux ${{ matrix.arch }} - JDK ${{ matrix.java }} - ${{ matrix.distribution }}
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
        distribution: [ 'temurin' ]
        arch: [ 'x86', 'arm' ]
        include:
          - arch: x86
            runs_on: [ self-hosted, type-cpx42, image-x86-system-ubuntu-24.04, in-nbg1-fsn1-hel1 ]
            java_arch: x64
            docker_platform: 'linux/amd64'
            mvn_opts: '-Dmaven.test.failure.ignore=true -Dyoutrackdb.test.env=ci -P docker-images,coverage -Ddocker.platforms=linux/amd64'
          - arch: arm
            # GitHub-hosted runner (Hetzner ARM capacity is scarce). This runner
            # is less potent than the Hetzner CAX nodes previously used, so two
            # options from the old ARM command are intentionally dropped:
            #   * -Dyoutrackdb.test.env=ci (disk-storage mode) — already
            #     exercised on the x86 leg; disk-IO-heavy suites time out here.
            #   * coverage profile — coverage is collected on x86 only.
            # docker-images is kept for the arm64 image build.
            runs_on: ubuntu-24.04-arm
            java_arch: aarch64
            docker_platform: 'linux/arm64/v8'
            mvn_opts: '-Dmaven.test.failure.ignore=true -P docker-images -Ddocker.platforms=linux/arm64/v8'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: ${{ matrix.java_arch }}
          overwrite-settings: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        id: tests
        run: ./mvnw $MAVEN_SETTINGS clean package -B ${{ matrix.mvn_opts }}
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}
      # Maven ignores test failures, so this gate reads reports and restores a failing outcome.
      - name: Gate Unit Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require surefire
      - name: Print VMLens Data Race Report
        if: always()
        run: |
          REPORT_DIR="core/target/vmlens-report"
          if [ -d "$REPORT_DIR" ]; then
            echo "::group::VMLens Data Race Report"
            echo "Report files:"
            find "$REPORT_DIR" -type f | sort
            echo ""
            for f in "$REPORT_DIR"/*.html; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") ==="
              # Strip HTML tags for readable log output
              sed 's/<[^>]*>//g; s/&nbsp;/ /g; s/&lt;/</g; s/&gt;/>/g; s/&amp;/\&/g' "$f" \
                | sed '/^[[:space:]]*$/d'
              echo ""
            done
            echo "::endgroup::"
          else
            echo "No VMLens report directory found at $REPORT_DIR"
          fi
      - name: Upload VMLens Report
        uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: vmlens-report-linux-${{ matrix.arch }}-jdk${{ matrix.java }}-${{ matrix.distribution }}
          path: 'core/target/vmlens-report/'
          if-no-files-found: ignore
          retention-days: 30
      # CANONICAL NOTE on what the timeout guarantee actually is; the other diagnostics-upload
      # steps in this file and in maven-integration-tests-pipeline.yml refer back to this one.
      # Three separate mechanisms, each doing a different job — none of them sufficient alone:
      #   1. always() makes the upload ELIGIBLE after a timeout. A timeout is reported as a
      #      cancellation, and the previous !cancelled() condition skipped the step outright in
      #      exactly that case. Necessary, but eligibility is not completion.
      #   2. Step ORDER makes it LIKELY to finish. Once a job is cancelled, the remaining steps
      #      share only GitHub's roughly five minutes of forced-termination time, so the upload is
      #      placed before the heavy publish action (which parses every report XML and calls the
      #      checks API) rather than behind it. This is best-effort inside a time box, not a
      #      guarantee. Nothing depends on the publish step's outputs, so the order is free.
      #   3. A step-level timeout, where one is in range, REMOVES the time box: it fails the step
      #      instead of cancelling the job, so the later steps run on the normal job budget. Only
      #      the small-cache job below has one; see the note there for why the nightly
      #      integration job cannot.
      # So: with (1) and (2) the upload is best-effort within about five minutes; with (3) it is
      # unconstrained.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): this job declares no timeout-minutes, so GitHub's
        # default 360-minute job limit is what fires, and a job killed by any timeout is
        # reported as cancelled — so !cancelled() skipped the upload in exactly the case the
        # dumps are the only evidence of what hung.
        #
        # The failsafe globs are deliberate future-proofing and match nothing today: this leg
        # runs `clean package`, which never reaches failsafe's integration-test phase. They
        # are kept so the step needs no edit if a verify phase is ever added, and
        # if-no-files-found: ignore makes a non-matching glob free.
        #
        # run_attempt is in the artifact name because upload-artifact v4+ rejects a duplicate
        # name within a run: on a job re-run the previous attempt's artifact still exists, so
        # a fixed name would 409 and fail the step. Suffixing keeps both attempts' diagnostics
        # instead of overwriting the first.
        if: always()
        with:
          name: test-diagnostics-linux-${{ matrix.arch }}-jdk${{ matrix.java }}-${{ matrix.distribution }}-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Tests Results (Linux ${{ matrix.arch }}, JDK ${{ matrix.java }} - ${{ matrix.distribution }})
      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        if: "!cancelled() && matrix.arch == 'x86' && matrix.java == '21' && matrix.distribution == 'temurin'"
        with:
          name: coverage-data
          path: '.coverage/reports/'
          retention-days: 1
          if-no-files-found: error
      - name: Collect Test Counts
        if: "!cancelled() && matrix.arch == 'x86' && matrix.java == '21' && matrix.distribution == 'temurin'"
        run: python3 .github/scripts/collect-test-counts.py --output /tmp/test-counts.json
      - name: Upload Test Counts
        uses: actions/upload-artifact@v7
        if: "!cancelled() && matrix.arch == 'x86' && matrix.java == '21' && matrix.distribution == 'temurin'"
        with:
          name: test-counts
          path: /tmp/test-counts.json
          retention-days: 1
          if-no-files-found: error
  test-windows:
    name: Windows x64 - JDK ${{ matrix.java }} - ${{ matrix.distribution }}
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
        distribution: [ 'temurin' ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: x64
          cache: 'maven'
          overwrite-settings: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        id: tests
        shell: bash
        run: ./mvnw $MAVEN_SETTINGS clean package -B -Dmaven.test.failure.ignore=true
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}
      # Maven ignores test failures, so this gate reads reports and restores a failing outcome.
      - name: Gate Unit Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require surefire
      # Ordered before Publish Test Results on purpose — see the comment in the Linux job:
      # both steps are always()-gated and share the ~5-minute post-timeout window, and the
      # publish action is the expensive one, so it must not starve the upload.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): this job declares no timeout-minutes, so GitHub's
        # default 360-minute job limit is what fires; either way a timeout-killed job is
        # reported as cancelled, which is precisely when these dumps are the only diagnostic
        # left. The failsafe globs are deliberate future-proofing and match nothing today
        # (`clean package` never runs failsafe); if-no-files-found: ignore makes them free.
        # run_attempt in the name avoids the upload-artifact v4+ duplicate-name 409 on re-runs.
        if: always()
        with:
          name: test-diagnostics-windows-jdk${{ matrix.java }}-${{ matrix.distribution }}-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Tests Results (Windows x64, JDK ${{ matrix.java }} - ${{ matrix.distribution }})

  test-macos:
    name: macOS arm - JDK ${{ matrix.java }} - ${{ matrix.distribution }}
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.should_build == 'true'
    # GitHub-hosted Apple Silicon runner. The docker-images profile is
    # intentionally omitted — it builds linux/amd64 and linux/arm64
    # images, which don't belong on a macOS runner. Otherwise options
    # mirror the Windows leg (reduced, since the runner is less potent
    # than the Hetzner CPX42 nodes).
    #
    # Non-blocking during soak period: this job is excluded from the
    # needs: of save-test-counts and the ci-status blocking check, so a
    # macOS failure does not block the build. The notify-failure/
    # notify-fixed jobs still observe it so the team sees macOS
    # regressions. Promote to blocking once the leg is proven stable on
    # develop.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
        distribution: [ 'temurin' ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: aarch64
          cache: 'maven'
          overwrite-settings: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        id: tests
        run: ./mvnw $MAVEN_SETTINGS clean package -B -Dmaven.test.failure.ignore=true
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}
      # Maven ignores test failures, so this gate reads reports and restores a failing outcome.
      - name: Gate Unit Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require surefire
      # Ordered before Publish Test Results on purpose — see the comment in the Linux job:
      # both steps are always()-gated and share the ~5-minute post-timeout window, and the
      # publish action is the expensive one, so it must not starve the upload.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): this job declares no timeout-minutes, so GitHub's
        # default 360-minute job limit is what fires; either way a timeout-killed job is
        # reported as cancelled, which is precisely when these dumps are the only diagnostic
        # left. The failsafe globs are deliberate future-proofing and match nothing today
        # (`clean package` never runs failsafe); if-no-files-found: ignore makes them free.
        # run_attempt in the name avoids the upload-artifact v4+ duplicate-name 409 on re-runs.
        if: always()
        with:
          name: test-diagnostics-macos-jdk${{ matrix.java }}-${{ matrix.distribution }}-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Tests Results (macOS arm, JDK ${{ matrix.java }} - ${{ matrix.distribution }})

  integration-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_integration_tests == 'true'
    permissions:
      contents: read
      checks: write
    runs-on: [ self-hosted, type-cpx42, image-x86-system-ubuntu-24.04, in-nbg1-fsn1-hel1 ]
    # Lower caps can terminate legitimate long-running integration tests.
    timeout-minutes: 600
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          overwrite-settings: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Maven Test
        id: tests
        run: >-
          ./mvnw $MAVEN_SETTINGS clean verify -B
          -Dmaven.test.failure.ignore=true -P ci-integration-tests -P docker-images
          -Ddocker.platforms=linux/amd64
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}

      # The gate verifies that every expected module produced required reports.
      # The gate verifies that the required report kinds ran tests.
      # The gate also checks every report for a failure or an error.
      # Use --allow-missing-module when a module produces no integration test report by design.
      # The option affects integration test reports only, because the gate derives expected modules only for those reports.
      - name: Gate Integration Test Results
        if: success()
        run: >-
          python3 .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require failsafe

      - name: Print VMLens Data Race Report
        if: always()
        run: |
          REPORT_DIR="core/target/vmlens-report"
          if [ -d "$REPORT_DIR" ]; then
            echo "::group::VMLens Data Race Report"
            echo "Report files:"
            find "$REPORT_DIR" -type f | sort
            echo ""
            for f in "$REPORT_DIR"/*.html; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") ==="
              sed 's/<[^>]*>//g; s/&nbsp;/ /g; s/&lt;/</g; s/&gt;/>/g; s/&amp;/\&/g' "$f" \
                | sed '/^[[:space:]]*$/d'
              echo ""
            done
            echo "::endgroup::"
          else
            echo "No VMLens report directory found at $REPORT_DIR"
          fi

      - name: Upload VMLens Report
        uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: vmlens-report-pr-integration-jdk21-temurin
          path: 'core/target/vmlens-report/'
          if-no-files-found: ignore
          retention-days: 30

      # Upload diagnostics before publishing results so timeout evidence gets priority.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-diagnostics-pr-integration-jdk21-temurin-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore

      # The publisher remains a second layer. It can also fail the job.
      # Keep job_summary enabled. Setting it false makes fork runs exit zero despite failing tests.
      # Upstream issue 789 documents this fork behavior.
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          action_fail_on_inconclusive: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: PR Integration Test Results (Linux x86, JDK 21 - temurin)

  # ------------------------------------------------------------------
  # JOB: SMALL CACHE INTEGRATION TESTS (advisory, not in ci-status gate)
  # Runs StorageComponent ITs with 4 MB disk cache to exercise
  # optimistic read fallback under heavy eviction pressure.
  # ------------------------------------------------------------------
  test-small-cache-linux:
    name: Small Cache IT (Linux x86)
    needs: [ detect-changes ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.detect-changes.outputs.should_build == 'true'
    runs-on:
      - self-hosted
      - in-nbg1
      - type-cpx42
      - image-x86-system-ubuntu-24.04
      - volume-cache
    timeout-minutes: 120
    # Job-level permissions REPLACE the workflow-level block, so enumerate every
    # scope this job uses: checkout (contents: read), publish-unit-test-result
    # (checks: write), and the gh workflow run dispatch below (actions: write).
    # actions: write is required because GITHUB_TOKEN now dispatches the fix agent
    # (workflow_dispatch is exempt from the "GITHUB_TOKEN can't trigger workflows"
    # rule); the workflow-level default of actions: read is insufficient.
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          overwrite-settings: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Small Cache Integration Tests
        # Step-level timeout 15 minutes inside the job's own timeout-minutes: 120, and within
        # GitHub's documented 360-minute maximum for a step timeout. A step timeout is recorded
        # as a step FAILURE, not a cancellation, so the remaining steps run with the normal job
        # budget instead of racing GitHub's ~5-minute forced-termination window. This is
        # mechanism (3) of the canonical note on the test-linux diagnostics upload above: always()
        # is what makes the upload eligible at all, and the step order is what makes it likely to
        # finish inside that window — this timeout is what removes the window. Any run this kills
        # would have been killed by the job timeout 15 minutes later anyway, so it cannot fail a
        # run that passes today.
        #
        # Deliberate side effect: a hang now ends the job as FAILED rather than CANCELLED, so it
        # reaches the failure()-gated Dispatch CI Fix Agent and Zulip steps below, which a
        # cancellation silently skipped. That is the intent — a suite that hangs for 105 minutes
        # is exactly the event those notifications exist for, and the diagnostics artifact the
        # agent needs is now uploaded before them.
        timeout-minutes: 105
        run: ./mvnw $MAVEN_SETTINGS -pl core -am clean verify -P small-cache-it -Dmaven.test.failure.ignore=true -B
        env:
          MAVEN_SETTINGS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && '-s .github/workflows/settings.xml' || '' }}
          MAVEN_MIRROR_USERNAME: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_USERNAME || '' }}
          MAVEN_MIRROR_PASSWORD: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAVEN_MIRROR_PASSWORD || '' }}
      # Maven ignores test failures, so this gate reads reports and restores a failing outcome.
      # Core skips unit tests under small-cache-it.
      # Other modules in the reactor still produce unit test reports.
      # Use --allow-missing-module when a module produces no integration test report by design.
      # The option affects integration test reports only, because the gate derives expected modules only for those reports.
      - name: Gate Small Cache Integration Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require surefire,failsafe
      # Ordered before Publish Test Results on purpose, and it matters most here: this is
      # the job with the tightest timeout (120 min) and the longest suite, so a timeout kill
      # is its most likely failure mode. Both steps are always()-gated and share the
      # ~5-minute post-timeout window; letting the expensive publish action go first could
      # consume it and drop the upload entirely.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): this job's own timeout-minutes: 120 fires long before
        # GitHub's default, and a timeout kill is reported as cancelled — exactly when the
        # dumps matter most.
        #
        # The failsafe globs below are this step's ONLY real diagnostics source and must not
        # be replaced. The surefire globs are ADDED as future-proofing, not because core unit
        # dumps appear here: the small-cache-it profile sets surefire skipTests=true for core
        # (core/pom.xml), so core runs no unit tests in this job at all. The only surefire
        # reports reachable are from the `-am` upstream modules (gremlin-annotations), which
        # is why the globs are kept rather than claimed to be load-bearing.
        #
        # run_attempt in the name avoids the upload-artifact v4+ duplicate-name 409 on a job
        # re-run. That collision mattered here beyond the lost artifact: a failing upload
        # step fails the job, which triggers the failure()-gated Dispatch CI Fix Agent and
        # Zulip notification steps below on what was only an artifact-name conflict.
        if: always()
        with:
          name: test-diagnostics-small-cache-linux-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: 'core/target/failsafe-reports/TEST-*.xml'
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Tests Results (Small Cache IT)
      # Inline dispatch (single non-matrix job, no dedicated notify-failure job needed)
      - name: Dispatch CI Fix Agent
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          gh workflow run ci-failure-fix-agent.yml \
            --repo "${{ github.repository }}" \
            -f failed_run_url="$FAILED_RUN_URL" \
            -f failed_workflow_name="$FAILED_WORKFLOW_NAME" \
            -f trigger_sha="$TRIGGER_SHA"
      - name: Send Zulip notification on failure
        if: failure()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **SMALL CACHE IT FAILED** :rotating_light:
            Small cache integration tests failed on `${{ github.head_ref || github.ref_name }}` for commit ${{ github.sha }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ------------------------------------------------------------------
  # JOB 3: COVERAGE GATE
  # Enforces line & branch coverage thresholds on new/changed code
  # Thresholds: 85% line coverage, 70% branch coverage (all PRs)
  # ------------------------------------------------------------------
  coverage-gate:
    name: Coverage Gate (New Code)
    needs: [ test-linux ]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Coverage Data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data
          path: .coverage/reports

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Coverage Gate
        id: gate
        continue-on-error: true
        run: |
          python3 .github/scripts/coverage-gate.py \
            --line-threshold 85 \
            --branch-threshold 70 \
            --compare-branch "origin/${{ github.event.pull_request.base.ref }}" \
            --coverage-dir .coverage/reports \
            --output-md /tmp/coverage-gate.md

      - name: Post Coverage Gate Comment
        if: >-
          always() &&
          steps.gate.outcome != 'cancelled' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/coverage-gate.md ]; then
            echo "No markdown report generated. Skipping comment."
            exit 0
          fi

          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          MARKER="<!-- coverage-gate-comment -->"

          # Find existing comment with our marker
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n1)

          BODY=$(jq -Rs '.' < /tmp/coverage-gate.md)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment ${COMMENT_ID}"
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH \
              --input <(jq -n --argjson body "$BODY" '{"body": $body}')
          else
            echo "Creating new comment"
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -X POST \
              --input <(jq -n --argjson body "$BODY" '{"body": $body}')
          fi

      - name: Enforce Coverage Gate
        if: always() && steps.gate.outcome == 'failure'
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPOSITORY" \
            && "$HEAD_REPOSITORY" == "$CURRENT_REPOSITORY" ]]; then
            echo "Coverage gate failed. See the pull request comment for details."
          else
            echo "Coverage gate failed. See the Run Coverage Gate step in this job log for details."
          fi
          exit 1

  # ------------------------------------------------------------------
  # JOB 4: TEST COUNT GATE
  # Detects unintentional test removal or disabling by comparing
  # current test counts against the develop baseline (stored in git
  # notes). Allows a configurable tolerance (default 5% per module).
  # Bypassed when PR title contains [no-test-number-check].
  # ------------------------------------------------------------------
  test-count-gate:
    name: Test Count Gate
    needs: [ test-linux ]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR Title for Bypass
        id: bypass
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"[no-test-number-check]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR title contains [no-test-number-check] — gate will be bypassed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Test Counts
        uses: actions/download-artifact@v8
        with:
          name: test-counts
          path: /tmp/test-counts

      - name: Fetch Baseline from Git Notes
        if: steps.bypass.outputs.skip != 'true'
        id: baseline
        run: |
          if git fetch origin refs/notes/test-counts:refs/notes/test-counts 2>/dev/null; then
            DEVELOP_SHA=$(git rev-parse origin/develop)
            if git notes --ref=test-counts show "$DEVELOP_SHA" > /tmp/test-counts-baseline.json 2>/dev/null; then
              echo "Loaded baseline from git notes for develop ($DEVELOP_SHA)"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "No git note found for develop HEAD ($DEVELOP_SHA)"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No test-counts notes ref found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Test Count Gate
        id: gate
        continue-on-error: true
        run: |
          ARGS=(
            --baseline /tmp/test-counts-baseline.json
            --current /tmp/test-counts/test-counts.json
            --tolerance 5
            --output-md /tmp/test-count-gate.md
          )
          if [[ "${{ steps.bypass.outputs.skip }}" == "true" ]]; then
            ARGS+=(--skip)
          fi

          python3 .github/scripts/test-count-gate.py "${ARGS[@]}"

      - name: Post Test Count Gate Comment
        if: >-
          always() &&
          steps.gate.outcome != 'cancelled' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/test-count-gate.md ]; then
            echo "No markdown report generated. Skipping comment."
            exit 0
          fi

          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          MARKER="<!-- test-count-gate-comment -->"

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n1)

          BODY=$(jq -Rs '.' < /tmp/test-count-gate.md)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment ${COMMENT_ID}"
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH \
              --input <(jq -n --argjson body "$BODY" '{"body": $body}')
          else
            echo "Creating new comment"
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -X POST \
              --input <(jq -n --argjson body "$BODY" '{"body": $body}')
          fi

      - name: Enforce Test Count Gate
        if: always() && steps.gate.outcome == 'failure'
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPOSITORY" \
            && "$HEAD_REPOSITORY" == "$CURRENT_REPOSITORY" ]]; then
            echo "Test count gate failed. See the pull request comment for details."
          else
            echo "Test count gate failed. See the Run Test Count Gate step in this job log for details."
          fi
          exit 1

  # ------------------------------------------------------------------
  # JOB 5: SAVE TEST COUNT BASELINE
  # On develop pushes, saves current test counts to git notes so that
  # future PRs can compare against the latest develop baseline.
  # ------------------------------------------------------------------
  save-test-counts:
    name: Save Test Count Baseline
    # test-macos intentionally excluded: non-blocking during soak period.
    needs: [ detect-changes, test-linux, test-windows ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Test Counts
        uses: actions/download-artifact@v8
        with:
          name: test-counts
          path: /tmp/test-counts

      - name: Save to Git Notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/notes/test-counts:refs/notes/test-counts 2>/dev/null || true
          git notes --ref=test-counts add -f \
            -F /tmp/test-counts/test-counts.json HEAD
          git push origin refs/notes/test-counts

          echo "Saved test counts to git notes for $(git rev-parse --short HEAD):"
          cat /tmp/test-counts/test-counts.json

  # ------------------------------------------------------------------
  # GATE JOB: CI STATUS
  # Reports success when every required test branch passes or has a permitted skip.
  # This workflow contributes `CI Status` to branch protection.
  # The Block Merge Commits workflow contributes `check-merges`.
  # ------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always() && github.event.pull_request.draft != true
    needs: [ detect-changes, integration-tests, test-linux, test-windows, test-macos, coverage-gate, test-count-gate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Verify embedded code examples in documentation
        run: npx embedme --verify **/*.md

      # Fold workflow TOC + annotation validation into the required CI Status
      # gate. The standalone `workflow-toc-check.yml` workflow gives fast,
      # path-filtered PR feedback, but it is not a required status check, so a
      # red TOC check there cannot block a merge (this is how a schema
      # violation reached develop unblocked). Running `--check` here makes a
      # violation fail CI Status — the blocking gate — on pull requests and on
      # develop pushes alike. The check is stdlib-only and finishes in ~1s, and
      # it runs before the should_build early-exit below so it also covers
      # workflow-only PRs that skip the build matrix.
      - name: Validate workflow TOC + annotations
        run: python3 .claude/scripts/workflow-reindex.py --check

      # Folded in for the same reason as the TOC check above: the standalone
      # `ci-fix-context-tests.yml` is path-filtered and advisory, so a red
      # gather-block test there cannot block a merge. The CI fix agent's
      # pre-fetch runs once per dispatch on a self-hosted runner and is the
      # agent's only source of truth about the failure it was sent to fix, so a
      # regression in it surfaces as a confident report written from no
      # evidence. The suite is stdlib-only, stubs `gh`, needs no token, and
      # finishes in ~5s.
      - name: Validate CI fix agent context pre-fetch
        run: python3 .github/scripts/ci-fix-context-test.py

      - name: Check results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SHOULD_BUILD: ${{ needs.detect-changes.outputs.should_build }}
          RUN_INTEGRATION_TESTS: ${{ needs.detect-changes.outputs.run_integration_tests }}
          INTEGRATION_SKIP_REASON: ${{ needs.detect-changes.outputs.integration_skip_reason }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          TEST_COUNT_RESULT: ${{ needs.test-count-gate.result }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "detect-changes job did not succeed (result: $DETECT_RESULT)"
            exit 1
          fi

          if [[ "$RUN_INTEGRATION_TESTS" == "true" ]]; then
            if [[ "$INTEGRATION_RESULT" != "success" ]]; then
              echo "Required integration tests did not succeed (result: $INTEGRATION_RESULT)"
              exit 1
            fi
          elif [[ "$RUN_INTEGRATION_TESTS" == "false" \
            && "$INTEGRATION_RESULT" == "skipped" ]]; then
            case "$INTEGRATION_SKIP_REASON" in
              no-it-tests|markdown-only|push|merge-group)
                echo "Integration tests skipped for permitted reason: $INTEGRATION_SKIP_REASON"
                ;;
              *)
                echo "Integration tests skipped for an unknown reason: '$INTEGRATION_SKIP_REASON'"
                exit 1
                ;;
            esac
          else
            echo "Integration decision and result disagree" \
              "(required=$RUN_INTEGRATION_TESTS, result=$INTEGRATION_RESULT)"
            exit 1
          fi

          if [[ "$SHOULD_BUILD" == "false" ]]; then
            echo "Build skipped — no relevant changes"
            exit 0
          fi
          # macOS is non-blocking during soak period: we wait for it
          # (it's in needs:) and log its result, but do not fail
          # ci-status on a macOS-only regression. The notify-failure
          # job observes test-macos separately and still alerts.
          echo "macOS result (non-blocking during soak): $MACOS_RESULT"
          if [[ "$LINUX_RESULT" != "success" ]] || \
             [[ "$WINDOWS_RESULT" != "success" ]]; then
            echo "Not all required jobs succeeded" \
              "(linux=$LINUX_RESULT, windows=$WINDOWS_RESULT)"
            exit 1
          fi
          # coverage-gate and test-count-gate only run on PRs;
          # on push events their result is "skipped", which is acceptable.
          if [[ "$COVERAGE_RESULT" != "success" && "$COVERAGE_RESULT" != "skipped" ]]; then
            echo "Coverage gate did not succeed (result: $COVERAGE_RESULT)"
            exit 1
          fi
          if [[ "$TEST_COUNT_RESULT" != "success" && "$TEST_COUNT_RESULT" != "skipped" ]]; then
            echo "Test count gate did not succeed (result: $TEST_COUNT_RESULT)"
            exit 1
          fi
          echo "All required jobs passed"

  notify-failure:
    name: Notify build failure on Zulip
    needs: [ detect-changes, test-linux, test-windows, test-macos ]
    if: >-
      failure() &&
      needs.detect-changes.outputs.should_build == 'true' &&
      github.event_name == 'push' &&
      contains(fromJSON(vars.MAIN_BRANCHES), github.ref_name)
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block. This job only
    # dispatches the CI Fix Agent via gh workflow run (actions: write) and posts
    # a Zulip message, so actions: write is the complete minimal set.
    permissions:
      actions: write
    steps:
      - name: Determine Branch Name
        id: branch_name
        run: echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Dispatch CI Fix Agent
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci-failure-fix-agent.yml \
            --repo "${{ github.repository }}" \
            -f failed_run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f failed_workflow_name="${{ github.workflow }}" \
            -f trigger_sha="${{ github.sha }}"
      - name: Send Zulip notification
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FAILED** :rotating_light:
            Build failed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            :robot: Automated fix agent has been dispatched and is investigating...
  notify-fixed:
    name: Notify build fixed on Zulip
    # test-macos intentionally excluded during soak: a "fixed" signal should
    # fire when Linux/Windows recover even if macOS is still flaky.
    needs: [ detect-changes, test-linux, test-windows ]
    if: >-
      always() &&
      needs.detect-changes.outputs.should_build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'push' &&
      contains(fromJSON(vars.MAIN_BRANCHES), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Determine Branch Name
        id: branch_name
        run: echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Get Previous Run Status
        id: previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_conclusion=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch "${{ steps.branch_name.outputs.branch }}" \
            --workflow "${{ github.workflow }}" \
            --limit 2 \
            --json conclusion \
            --jq '.[1].conclusion')
          echo "previous_conclusion=$previous_conclusion" >> $GITHUB_OUTPUT

      - name: Send Zulip notification
        if: steps.previous_run.outputs.previous_conclusion == 'failure'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FIXED** :white_check_mark:
            Build fixed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})