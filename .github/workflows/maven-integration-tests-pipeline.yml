name: Java CI/CD Integration Tests Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  schedule:
    # Run at 2 AM CET (1 AM UTC)
    - cron: '0 1 * * *'

# Concurrency policy is trigger-dependent:
#   - push / schedule: cancel-in-progress=false. A new run does NOT kill the
#     running build; it becomes "pending" and starts only after the current
#     build finishes. GitHub keeps at most one pending run per group, so a
#     burst of pushes collapses to the latest commit — the queued run checks
#     out the develop tip, so it always tests the last change.
#   - workflow_dispatch: cancel-in-progress=true. A manual trigger cancels the
#     in-progress (and any pending) run and starts immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write
  packages: write
  actions: write
  checks: write
jobs:
  check-changes:
    name: Check for Code Changes
    runs-on: ubuntu-latest
    # Define outputs so the next job can read them
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      # Range boundaries for the YouTrack fixed-notifier: the SHA this run
      # tested/deployed, and the SHA of the previous successful deploy.
      current_sha: ${{ steps.check.outputs.current_sha }}
      last_success_sha: ${{ steps.check.outputs.last_success_sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
          # We only need the tip (depth 1) to get the current SHA. Very fast.
          fetch-depth: 1
      - name: Check against last successful run
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. If this is a manual trigger, always run.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger detected. Force run."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Get the current commit SHA (on develop)
          CURRENT_SHA=$(git rev-parse HEAD)

          # 3. Get the SHA of the LAST SUCCESSFUL run of THIS specific workflow on 'develop'
          # We use the GitHub CLI (gh) to look up workflow history
          LAST_SUCCESS_SHA=$(gh run list --branch develop \
            --workflow "Java CI/CD Integration Tests Pipeline" \
            --status success \
            --limit 1 \
            --json headSha \
            -q '.[0].headSha')

          echo "Current SHA: $CURRENT_SHA"
          echo "Last Success SHA: $LAST_SUCCESS_SHA"

          # Expose both SHAs so the post-deploy update-youtrack job can
          # diff the commit range "since the last successful deploy".
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "last_success_sha=$LAST_SUCCESS_SHA" >> $GITHUB_OUTPUT

          # 4. Compare
          if [ "$CURRENT_SHA" == "$LAST_SUCCESS_SHA" ]; then
            echo "The current commit has already been successfully tested."
            echo "Skipping tests to save resources."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "New code detected (or no previous success found). Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  test-linux:
    name: Linux ${{ matrix.arch }} - JDK ${{ matrix.java }} - ${{ matrix.distribution }}
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
        distribution: [ 'temurin' ]
        arch: [ 'x86', 'arm' ]
        include:
          - arch: x86
            # Powerful self-hosted Hetzner runner: full job — integration tests
            # (clean verify) plus the multi-arch Docker image build.
            runs_on: [ self-hosted, type-cpx42, image-x86-system-ubuntu-24.04, in-nbg1-fsn1-hel1 ]
            maven_goals: 'clean verify'
            mvn_opts: '-Dmaven.test.failure.ignore=true -P ci-integration-tests -P docker-images -Ddocker.platforms=linux/amd64'
            required_report_kinds: 'surefire,failsafe'
            java_arch: x64
          - arch: arm
            # GitHub-hosted runner — Hetzner ARM capacity is scarce. This runner
            # is weak, like windows-latest, so it runs the light test build: clean
            # package with unit tests only, no failsafe integration-test/verify
            # phase. The Docker image build is bound to the package phase, so it
            # still produces the arm64 image without running integration tests.
            runs_on: ubuntu-24.04-arm
            maven_goals: 'clean package'
            mvn_opts: '-Dmaven.test.failure.ignore=true -P ci-integration-tests -P docker-images -Ddocker.platforms=linux/arm64/v8'
            # The ARM leg never reaches integration tests, so it requires unit test reports only.
            required_report_kinds: 'surefire'
            java_arch: aarch64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: ${{ matrix.java_arch }}
          overwrite-settings: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Maven Test
        id: tests
        # No step-level timeout here, deliberately. The obvious value (just inside this job's
        # timeout-minutes: 600) is not expressible: GitHub documents a maximum of 360 for
        # jobs.<job_id>.steps[*].timeout-minutes on both hosted and self-hosted runners, so a
        # 570 would be out of range — currently unenforced, but not something to rely on. Any
        # in-range value (<= 360) would be well below this job's 600-minute budget and could
        # kill integration runs that legitimately take longer, which is a real regression for a
        # nightly suite sized at 600.
        #
        # What this job gives up by not having one, stated precisely (see the canonical note on
        # the test-linux diagnostics upload in maven-pipeline.yml): always() still makes the
        # upload ELIGIBLE after the job timeout, and the upload is ordered before the heavy
        # publish step so it is LIKELY to finish — but on this job that remains best-effort
        # inside GitHub's roughly five minutes of forced-termination time, because only a
        # step-level timeout removes that time box. That is the trade accepted here: a
        # best-effort upload on a 600-minute nightly, versus a step cap that could kill runs
        # which legitimately need more than 360 minutes. The small-cache job in
        # maven-pipeline.yml keeps its step timeout because 105 is comfortably in range.
        run: ./mvnw -s .github/workflows/settings.xml ${{ matrix.maven_goals }} -B ${{ matrix.mvn_opts }}
        env:
          MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

      - name: Verify Report Kind Configuration
        shell: bash
        env:
          MAVEN_GOALS: ${{ matrix.maven_goals }}
          REQUIRED_REPORT_KINDS: ${{ matrix.required_report_kinds }}
        run: |
          if [[ " $MAVEN_GOALS " == *" verify "* \
              && ",$REQUIRED_REPORT_KINDS," != *",failsafe,"* ]]; then
            echo "::error::Maven goals '$MAVEN_GOALS' reach verify, but required kinds '$REQUIRED_REPORT_KINDS' omit failsafe."
            exit 1
          fi

      # Maven ignores test failures, so this gate reads reports and restores a failing outcome.
      # Use --allow-missing-module when a module produces no integration test report by design.
      # The option affects integration test reports only, because the gate derives expected modules only for those reports.
      - name: Gate Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require "${{ matrix.required_report_kinds }}"

      - name: Print VMLens Data Race Report
        if: always()
        run: |
          REPORT_DIR="core/target/vmlens-report"
          if [ -d "$REPORT_DIR" ]; then
            echo "::group::VMLens Data Race Report"
            echo "Report files:"
            find "$REPORT_DIR" -type f | sort
            echo ""
            for f in "$REPORT_DIR"/*.html; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") ==="
              # Strip HTML tags for readable log output
              sed 's/<[^>]*>//g; s/&nbsp;/ /g; s/&lt;/</g; s/&gt;/>/g; s/&amp;/\&/g' "$f" \
                | sed '/^[[:space:]]*$/d'
              echo ""
            done
            echo "::endgroup::"
          else
            echo "No VMLens report directory found at $REPORT_DIR"
          fi
      - name: Upload VMLens Report
        uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: vmlens-report-linux-${{ matrix.arch }}-jdk${{ matrix.java }}-${{ matrix.distribution }}
          path: 'core/target/vmlens-report/'
          if-no-files-found: ignore
          retention-days: 30
      # Diagnostics upload runs BEFORE Publish Test Results, deliberately — mechanism (2) of the
      # canonical note on the test-linux diagnostics upload in maven-pipeline.yml. Both steps are
      # always()-gated, so both are eligible after a timeout, but once the job is cancelled they
      # share only GitHub's roughly five minutes of forced-termination time; the publish action is
      # the heavy one (it parses every report XML and calls the checks API) and this job produces
      # the most reports of any, so behind it the upload could fail to finish. This job has no
      # step-level timeout to remove that time box (see the Run Maven Test note above), so the
      # ordering is the only thing improving the odds here. Nothing depends on the publish step's
      # outputs, so the order is free.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): a job killed by a timeout is reported as cancelled, so
        # !cancelled() skipped the upload in exactly the case the dumps are the only evidence
        # of what hung. Which timeout fires differs per leg: the x86 leg is self-hosted, so
        # this job's timeout-minutes: 600 applies; the arm leg runs on a GitHub-hosted runner,
        # where the 6-hour (360-minute) hard limit on hosted jobs is reached first and the 600
        # setting can never fire.
        #
        # Mixed matrix, so BOTH report directories are needed and neither may be dropped: the
        # x86 leg runs `clean verify` (failsafe — previously not collected here at all) and the
        # arm leg runs `clean package` (surefire only). The surefire globs are kept as-is and
        # the failsafe ones added.
        #
        # run_attempt is in the artifact name because upload-artifact v4+ rejects a duplicate
        # name within a run: on a job re-run the previous attempt's artifact still exists, so a
        # fixed name would 409 and fail the step. Suffixing keeps both attempts' diagnostics.
        if: always()
        with:
          name: test-diagnostics-integration-linux-${{ matrix.arch }}-jdk${{ matrix.java }}-${{ matrix.distribution }}-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Integration Tests Results (Linux ${{ matrix.arch }}, JDK ${{ matrix.java }} - ${{ matrix.distribution }})

  test-windows:
    name: Windows x64 - JDK ${{ matrix.java }} - ${{ matrix.distribution }} (${{ matrix.shard.id }})
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: windows-latest
    # Job-level permissions REPLACE the broader workflow-level block (contents, packages,
    # actions, checks: write) that other jobs in this file need. This job checks out the
    # repository (contents: read) and publishes a test-result check run (checks: write);
    # it writes no contents, no packages and no workflow runs. Scoping matters more since
    # the shard split below: actions/checkout persists the token into .git/config for the
    # length of the job, and the split takes that from 2 runners per night to 8.
    permissions:
      contents: read
      checks: write
    # GitHub caps a hosted-runner job at 360 minutes and the cap cannot be raised. That cap,
    # not this setting, is why the suite is split across shards; the shard comment below is the
    # canonical account of the split and carries the measurements. The test-linux leg escaped
    # the same ceiling in #1177 by declaring timeout-minutes: 600, which works only because
    # that leg is self-hosted.
    #
    # Declaring 300 buys two things over inheriting the 360 cap. The difference for
    # diagnostics is categorical, not a matter of degree: reaching the 360 cap terminates the
    # job, so no always()-gated step runs at all, whereas timeout-minutes cancels it and
    # cancelled jobs still get GitHub's roughly five-minute window — the same window the
    # test-linux diagnostics note describes. And 300 clears the longest shard's projected
    # 170-230 minutes on Windows, so it should fire only on a genuine stall.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
        distribution: [ 'temurin' ]
        # One Maven invocation of this suite does not fit in 360 minutes on a hosted Windows
        # runner, so it is split along core's own surefire executions. Measured on Linux, where
        # the whole invocation takes 37 minutes: core alone is 32 of those, so a split by Maven
        # module cannot balance — core holds 1373 of the repository's ~1499 test classes.
        #
        # The shards are exhaustive and disjoint. core's default-test and sequential-tests
        # executions both exclude **/gremlintest/**, where all five TinkerPop compliance wrapper
        # classes live, so the unit and compliance sides share no test class. core's tests run
        # only in the three `-pl core -am` shards; the modules shard unbinds every core test
        # execution — both surefire's and vmlens's, which runs **/*MTTest.java in the same
        # phase — and owns every other module's tests. So nothing runs twice beyond
        # gremlin-annotations' two test classes, which every shard rebuilds: `-am` pulls them
        # into the three core shards and the modules shard builds the full reactor.
        #
        # Measured Linux wall time per shard, against 37:06 for the unsplit invocation:
        # core-unit 18:48, core-gremlin-process 12:24, core-gremlin-structure 6:42, modules
        # 7:11. So the longest shard is 51 % of the unsplit run, and the four together cost
        # 45:05, about 22 % more machine time than one invocation. That overhead is the reactor
        # build each shard repeats: the modules shard rebuilds core without running its tests
        # in 2:52, which is the floor no split can go below.
        #
        # core-unit is the shard to split next if this leg creeps back towards the cap, since
        # nearly 16 of its 18:48 is test execution. Its two executions, default-test and
        # sequential-tests, would separate along the same unbind mechanism. That should leave
        # core-gremlin-process's 12:24 as the longest shard, though the figure is an estimate
        # rather than a measurement: the two executions do not divide in proportion to their
        # 19136 and 2230 test counts, because default-test runs four classes at a time
        # (threadCountClasses=4) while sequential-tests is single-threaded by design.
        #
        # A surefire execution added to core later lands in whichever shard's profile holds it,
        # and one added to core's <build> runs in every shard. Both directions run a test more
        # often than needed rather than dropping it.
        #
        # The single quotes around each '!<profile-id>' are load-bearing, and so is passing
        # mvn_args through ${{ }} interpolation rather than an env var. Written as a bare
        # $MVN_ARGS the shell word-splits without removing quotes, so Maven would receive the
        # literal text including the quote characters, match no profile id, and — because Maven
        # only warns when a -P deactivation names an unknown profile — run the suites the shard
        # was meant to skip. That failure is green, not red. Any move to env must use a bash
        # array or eval "set -- $MVN_ARGS". This holds only while these stay workflow-authored
        # literals: a shard argument ever derived from a workflow_dispatch input or an event
        # payload must NOT be interpolated here, because that would be direct shell injection
        # into a step whose env carries the Maven mirror password.
        shard:
          - id: core-unit
            # core's default-test (19136 tests) and sequential-tests (2230 tests).
            mvn_args: "-pl core -am -P '!gremlin-compliance-process-suites' -P '!gremlin-compliance-structure-suites'"
          - id: core-gremlin-process
            # The two TinkerPop process compliance suites, the costliest pair.
            mvn_args: "-pl core -am -Dyoutrackdb.shard.skipCoreUnitTests=true -P '!gremlin-compliance-structure-suites'"
          - id: core-gremlin-structure
            # The structure suite plus both graph-feature suites (1930 scenarios each).
            mvn_args: "-pl core -am -Dyoutrackdb.shard.skipCoreUnitTests=true -P '!gremlin-compliance-process-suites'"
          - id: modules
            # Full reactor with every core surefire execution unbound, so this shard runs the
            # tests of server, tests, embedded, examples and jmh-ldbc. core still builds here
            # because those modules depend on it.
            mvn_args: "-Dyoutrackdb.shard.skipCoreUnitTests=true -P '!gremlin-compliance-process-suites' -P '!gremlin-compliance-structure-suites'"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
          fetch-depth: 0
          # This job runs no git operation after the checkout, so the token does not need to
          # sit in .git/config for the length of a multi-hour test run that executes project
          # code. maven-pipeline.yml's integration-tests job builds the same reactor the same
          # way with this set. buildnumber-maven-plugin:create still works: at its default
          # doCheck/doUpdate it reads local git plumbing and contacts no remote.
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: x64
          cache: 'maven'
          overwrite-settings: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Shard membership rests on two things in core/pom.xml, and both fail silently when it
      # drifts: the compliance profile ids a shard deactivates with -P '!<id>' (Maven only
      # warns when that names a profile which does not exist), and the execution ids the
      # shard-skip-core-unit-tests profile rebinds to phase none (a renamed execution makes
      # the entry merge as a new one instead of unbinding the real one). The second case was
      # live for the vmlens plugin until review caught it. Neither loses coverage, but both
      # run a suite in shards meant to skip it and cost a slow runner an extra hour.
      - name: Verify Shard Configuration
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/verify-test-shards.py

      - name: Run Maven Test
        id: tests
        shell: bash
        run: ./mvnw -s .github/workflows/settings.xml clean package -B -Dmaven.test.failure.ignore=true -P ci-integration-tests ${{ matrix.shard.mvn_args }}
        env:
          MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

      # The Maven command carries -Dmaven.test.failure.ignore=true, so Maven exits successfully after test failures.
      - name: Gate Unit Test Results
        if: success()
        shell: bash
        run: >-
          "${{ steps.python.outputs.python-path }}" .github/scripts/test-failure-gate.py
          --root '${{ github.workspace }}' --require surefire

      # Ordered before Publish Test Results on purpose — see the comment in the Linux job:
      # both steps are always()-gated and share the ~5-minute post-timeout window, and the
      # publish action is the expensive one, so it must not starve the upload.
      - name: Upload Test Diagnostics
        uses: actions/upload-artifact@v7
        # always(), NOT !cancelled(): a timeout-killed job is reported as cancelled, which is
        # precisely when these dumps are the only diagnostic left. This job's
        # timeout-minutes: 300 fires before GitHub's hosted 360-minute cap, which is what makes
        # this step reachable at all on a stalled shard — see the timeout-minutes note on this
        # job for why the two cases differ categorically.
        #
        # This leg runs `clean package -P ci-integration-tests`, so failsafe never executes;
        # the failsafe globs are deliberate future-proofing for a promotion to verify and match
        # nothing today (if-no-files-found: ignore makes them free).
        #
        # run_attempt in the name avoids the upload-artifact v4+ duplicate-name 409 on re-runs.
        # The shard id is in the name for the same reason: the four shards of one JDK would
        # otherwise upload under one name and 409.
        if: always()
        with:
          name: test-diagnostics-integration-windows-jdk${{ matrix.java }}-${{ matrix.distribution }}-${{ matrix.shard.id }}-attempt${{ github.run_attempt }}
          path: |
            **/target/deadlock-report.txt
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports/*.dump
            **/target/failsafe-reports/*.dumpstream
            **/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          compare_to_earlier_commit: false
          check_name: Integration Tests Results (Windows x64, JDK ${{ matrix.java }} - ${{ matrix.distribution }}, ${{ matrix.shard.id }})

  merge-to-main:
    name: Merge develop into main
    needs: [ test-linux, test-windows ]
    if: success() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Every GitHub operation here authenticates with the minted App token
    # (checkout + persisted push credential); no step uses GITHUB_TOKEN, so the
    # built-in token carries no scopes (defense-in-depth over the broad
    # workflow-level grant).
    permissions: {}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          # Downscope the installation token to exactly what merge-to-main needs:
          # push commits to main (contents) including any .github/workflows/**
          # changes (workflows). Narrower than the App's full installation grant.
          permission-contents: write
          permission-workflows: write

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 0
          # Short-lived GitHub App installation token replaces the previous PAT.
          # persist-credentials defaults to true, so the later git push origin main
          # reuses this credential; an App-authored push to protected main also
          # fires downstream push-triggered workflows (a GITHUB_TOKEN push would not).
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify branches are aligned for fast-forward
        run: |
          git fetch origin develop

          # Check if main is an ancestor of develop (required for fast-forward)
          if ! git merge-base --is-ancestor origin/main origin/develop; then
            echo "ERROR: main branch contains commits not present in develop."
            echo "Fast-forward merge is not possible. Branches have diverged."
            echo ""
            echo "Commits in main not in develop:"
            git log origin/develop..origin/main --oneline
            exit 1
          fi

          echo "Verification passed: main is an ancestor of develop, fast-forward is possible."

      - name: Merge develop into main (fast-forward only)
        run: |
          git merge origin/develop --ff-only
          git push origin main

  # ------------------------------------------------------------------
  # JOB: DEPLOY
  # Publishes artifacts to Maven Central, gated on the integration
  # tests passing. Runs on develop pushes and manual dispatch only
  # (skipped on the nightly schedule). Parallel to merge-to-main; both
  # depend on test-linux + test-windows. Uses JDK 21.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy Artifacts
    needs: [ test-linux, test-windows ]
    if: success() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The timestamped coordinate is the uniquely addressable artifact just
    # published; update-youtrack quotes it in the "Fixed in <version>" comment.
    outputs:
      version: ${{ steps.deployed.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          # Always publish develop. A workflow_dispatch run must not be able to
          # publish an arbitrary branch or tag to Maven Central under the
          # project's coordinates, so the ref is pinned regardless of trigger.
          ref: 'develop'

      - name: Set Short SHA and Timestamp
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y%m%d.%H%M%S')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21 settings
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          overwrite-settings: false
      - name: Maven deploy
        #1. Deploy to Maven Central as -dev-SNAPSHOT
        #2. Deploy to Maven Central with -TIMESTAMP-SHA-dev-SNAPSHOT suffix (sortable by date)
        run: |
          mvn -s .github/workflows/settings.xml clean deploy -Dchangelist=-dev-SNAPSHOT -DskipTests -Dspotless.check.skip=true -B
          mvn -s .github/workflows/settings.xml clean deploy -Dchangelist=-dev-SNAPSHOT -Dsha1=-${{ steps.vars.outputs.timestamp }}-${{ steps.vars.outputs.sha_short }} -DskipTests=true -Dspotless.check.skip=true -B
        env:
          # Credentials mapped to environment variables
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

      - name: Annotate deployed versions
        id: deployed
        run: |
          VERSION_SNAPSHOT=$(mvn -s .github/workflows/settings.xml help:evaluate -Dexpression=project.version -Dchangelist=-dev-SNAPSHOT -q -DforceStdout)
          VERSION_SHA=$(mvn -s .github/workflows/settings.xml help:evaluate -Dexpression=project.version -Dchangelist=-dev-SNAPSHOT -Dsha1=-${{ steps.vars.outputs.timestamp }}-${{ steps.vars.outputs.sha_short }} -q -DforceStdout)
          echo "::notice title=Maven Artifact Deployed::${VERSION_SNAPSHOT}"
          echo "::notice title=Maven Artifact Deployed::${VERSION_SHA}"
          # Hand the timestamped coordinate to the update-youtrack job.
          echo "version=${VERSION_SHA}" >> "$GITHUB_OUTPUT"
        env:
          MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

  # ------------------------------------------------------------------
  # JOB: UPDATE-YOUTRACK
  # After a successful deploy, walk the commits "since the last
  # successful deploy" and, for every YTDB issue referenced in a commit
  # title, post a "Fixed in <version>" comment and move the issue to the
  # Fixed state. Issues already in a resolved state are skipped, so a
  # Verified/Closed issue is never re-opened and re-runs are idempotent.
  #
  # Push-only: a manual workflow_dispatch deploys an artifact but must not
  # mutate the issue tracker (it may target an arbitrary develop commit,
  # and the range math assumes the linear push history). Skipped entirely
  # on the first run / when no prior successful deploy exists, and when
  # the current commit equals the last successful one.
  #
  # A failure here does NOT fire the build-failure siren and does NOT
  # dispatch the CI Fix Agent (a sync failure is operational — token /
  # API / rejected transition — not a code or test bug the agent can
  # fix), nor does it suppress the "build fixed" signal. Instead the
  # dedicated notify-youtrack-failure job below pages 'ci status' at low
  # severity, and the job's own red status shows in the Actions UI.
  # ------------------------------------------------------------------
  update-youtrack:
    name: Mark fixed issues in YouTrack
    needs: [ check-changes, deploy ]
    if: >-
      success() &&
      github.event_name == 'push' &&
      needs.check-changes.outputs.last_success_sha != '' &&
      needs.check-changes.outputs.last_success_sha != needs.check-changes.outputs.current_sha
    runs-on: ubuntu-latest
    # Least privilege: the only write target is YouTrack (via YOUTRACK_TOKEN).
    # checkout needs read access to clone the range; nothing here uses the
    # GITHUB_TOKEN write scopes granted at the workflow level.
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          # Pin to the exact commit this run deployed so the range end
          # matches the published artifact, and fetch full history so the
          # last-success SHA is reachable for the git-log diff.
          ref: ${{ needs.check-changes.outputs.current_sha }}
          fetch-depth: 0

      - name: Mark fixed issues in YouTrack
        env:
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          # Pass run inputs through env rather than interpolating ${{ }} into the
          # run: shell, so a value can never be expanded as shell syntax (the
          # GitHub-recommended pattern for untrusted-or-derived expansions).
          FROM_SHA: ${{ needs.check-changes.outputs.last_success_sha }}
          TO_SHA: ${{ needs.check-changes.outputs.current_sha }}
          DEPLOYED_VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          python3 .github/scripts/youtrack-fixed-notifier.py \
            --from-sha "$FROM_SHA" \
            --to-sha "$TO_SHA" \
            --version "$DEPLOYED_VERSION"

  notify-failure:
    name: Notify build failure on Zulip
    needs: [ test-linux, test-windows, merge-to-main, deploy ]
    # The two `cancelled` arms exist because a job killed by timeout-minutes reports
    # `cancelled`, not `failure`. Without them this job stayed silent on exactly that path:
    # in run 566 the Windows JDK 21 timeout was the only fault in the run, and this job was
    # skipped, so nobody was paged and no fix agent was dispatched.
    #
    # always() is kept rather than !cancelled(). Run 566's run-level conclusion was itself
    # `cancelled`, so it cannot be assumed that cancelled() is false on the very path these
    # arms are here to catch, and guessing wrong would restore the silence. The cost is that a
    # run cancelled by a superseding manual dispatch, or by hand, also pages; the message
    # below prints each leg's result so that page explains itself.
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' &&
      (
        needs.test-linux.result == 'failure' ||
        needs.test-windows.result == 'failure' ||
        needs.merge-to-main.result == 'failure' ||
        needs.deploy.result == 'failure' ||
        needs.test-linux.result == 'cancelled' ||
        needs.test-windows.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the broader workflow-level block (contents,
    # packages, actions, checks: write) that other jobs in this file need. This
    # job only dispatches the CI Fix Agent via gh workflow run (actions: write)
    # and posts a Zulip message, so actions: write is the complete minimal set.
    permissions:
      actions: write
    steps:
      # Deliberately still gated on `failure` only, while the job's own condition also
      # covers `cancelled`. Two reasons not to widen it: ci-failure-fix-agent.yml mints an App
      # token with contents and workflows write, so auto-dispatching it on a timeout would
      # widen what a stalled job can set in motion; and that workflow gathers its context by
      # selecting jobs with `.conclusion == "failure"`, so a dispatch after a timeout would
      # hand the agent empty logs. A cancelled leg therefore pages a human instead, and the
      # message below says so rather than claiming an agent is on it.
      - name: Dispatch CI Fix Agent
        id: dispatch
        if: >-
          needs.test-linux.result == 'failure' ||
          needs.test-windows.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci-failure-fix-agent.yml \
            --repo "${{ github.repository }}" \
            -f failed_run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f failed_workflow_name="${{ github.workflow }}" \
            -f trigger_sha="${{ github.sha }}"
      # always() because this step inherits an implicit success() otherwise: a dispatch that
      # runs and fails would abort the job here and send nothing, which is the same silence
      # the cancelled arms above exist to remove, reached another way. The dispatch step keeps
      # its own failure, so a broken dispatch still shows up as a failed job.
      - name: Send Zulip Notification
        if: always()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FAILED** :rotating_light:
            Integration tests or merge failed on branch `${{ github.ref_name }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            Legs: test-linux `${{ needs.test-linux.result }}`, test-windows `${{ needs.test-windows.result }}`, merge-to-main `${{ needs.merge-to-main.result }}`, deploy `${{ needs.deploy.result }}`.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.dispatch.outcome == 'success'
                && ':robot: Automated fix agent has been dispatched and is investigating...'
                || (steps.dispatch.outcome == 'skipped'
                    && ':warning: No fix agent dispatched, because no leg reported `failure`. A leg was cancelled instead, most often by its own timeout-minutes or by a superseding run. Inspect the run manually.'
                    || ':rotating_light: A leg reported `failure`, but dispatching the fix agent failed. No agent is investigating. Inspect the run manually.') }}

  notify-youtrack-failure:
    name: Notify YouTrack sync failure on Zulip
    needs: [ update-youtrack ]
    # The deploy itself succeeded; only the post-deploy YouTrack issue
    # sync (comment + State transition) failed. This is operational —
    # token expired or under-scoped, YouTrack API down, or a State
    # transition rejected — not a code/test regression, so we page at low
    # severity (:warning:) and never dispatch the CI Fix Agent. always()
    # is required so this job still runs after its dependency failed;
    # update-youtrack only runs on push, so its result is 'failure' only
    # in that context (it is 'skipped' on dispatch / schedule).
    if: always() && needs.update-youtrack.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Zulip Notification
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **YOUTRACK SYNC FAILED** :warning:
            Deploy succeeded, but marking fixed issues in YouTrack failed on branch `${{ github.ref_name }}` for commit ${{ github.sha }} (repo ${{ github.repository }}). Likely a token/permissions issue, a YouTrack API outage, or a rejected State transition — the build and published artifact are fine and no code fix is needed. Re-running the workflow retries the commit range; already-resolved issues are skipped, so successfully-updated issues are not touched twice.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  notify-fixed:
    name: Notify build fixed on Zulip
    # deploy IS included so a deploy failure suppresses the "fixed" signal —
    # we must never report "build fixed" while artifact publishing is broken
    # (a deploy-only failure already triggers notify-failure). deploy is
    # skipped on the nightly schedule, but a skipped need does not make
    # success() false, so the fixed signal still fires on scheduled runs.
    needs: [ test-linux, test-windows, merge-to-main, deploy ]
    if: success() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Get Previous Run Status
        id: previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_conclusion=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --workflow "${{ github.workflow }}" \
            --limit 2 \
            --json conclusion \
            --jq '.[1].conclusion')
          echo "previous_conclusion=$previous_conclusion" >> $GITHUB_OUTPUT

      - name: Send Zulip notification
        if: steps.previous_run.outputs.previous_conclusion == 'failure'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FIXED** :white_check_mark:
            Build fixed on branch `${{ github.ref_name }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
